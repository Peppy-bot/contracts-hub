name: Contract similarity tests

# Proposed test code runs without the adviser's OAuth secret or write token.
on:
  pull_request:
    paths:
      - .github/scripts/**
      - .github/workflows/contract-similarity*.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/**
      - .github/workflows/contract-similarity*.yml

permissions:
  contents: read

concurrency:
  group: contract-similarity-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=2/ram=4+8/family=c8a+c7a+m8a+m7a  # custom Peppy AMI
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r .github/scripts/requirements.txt

      - name: Test the advisory automation
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
